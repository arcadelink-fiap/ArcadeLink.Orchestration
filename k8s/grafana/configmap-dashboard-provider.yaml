apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: arcadelink
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: arcadelink
        orgId: 1
        type: file
        disableDeletion: false
        options:
          path: /var/lib/grafana/dashboards
