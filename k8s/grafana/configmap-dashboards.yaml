apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  arcadelink-dashboard.json: |
    {
      "title": "ArcadeLink — Users & Catalog",
      "panels": [
        {
          "title": "Latência (p95, por endpoint)",
          "type": "graph",
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, handler))" }
          ]
        },
        {
          "title": "Requisições por status HTTP",
          "type": "graph",
          "targets": [
            { "expr": "sum(rate(http_requests_received_total[5m])) by (code)" }
          ]
        },
        {
          "title": "Taxa de erro (status >= 500)",
          "type": "graph",
          "targets": [
            { "expr": "sum(rate(http_requests_received_total{code=~\"5..\"}[5m])) / sum(rate(http_requests_received_total[5m]))" }
          ]
        }
      ]
    }
