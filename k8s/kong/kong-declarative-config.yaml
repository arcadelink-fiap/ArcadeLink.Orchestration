apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
data:
  kong.yml: |
    _format_version: "3.0"

    services:
      - name: users-api
        url: http://users-api:80
        routes:
          - name: users-public-auth
            paths:
              - /auth
            methods:
              - POST
            strip_path: false
          - name: users-protected
            paths:
              - /users
            methods:
              - GET
              - DELETE
            strip_path: false
            plugins:
              - name: jwt
                config:
                  claims_to_verify:
                    - exp
              - name: post-function
                config:
                  access:
                    - |
                      local jwt_parser = require("kong.plugins.jwt.jwt_parser")
                      local decoded = jwt_parser:new(kong.ctx.shared.authenticated_jwt_token)
                      local claims = decoded and decoded.claims or {}
                      local role = claims["http://schemas.microsoft.com/ws/2008/06/identity/claims/role"] or claims.role or ""
                      kong.service.request.set_header("X-User-Id", claims.sub or "")
                      kong.service.request.set_header("X-User-Role", role)

      - name: catalog-api
        url: http://catalog-api:80
        routes:
          - name: catalog-public-reads
            paths:
              - /games
            methods:
              - GET
            strip_path: false
          - name: catalog-protected
            paths:
              - /games
            methods:
              - POST
              - PUT
              - DELETE
            strip_path: false
            plugins:
              - name: jwt
                config:
                  claims_to_verify:
                    - exp
              - name: post-function
                config:
                  access:
                    - |
                      local jwt_parser = require("kong.plugins.jwt.jwt_parser")
                      local decoded = jwt_parser:new(kong.ctx.shared.authenticated_jwt_token)
                      local claims = decoded and decoded.claims or {}
                      local role = claims["http://schemas.microsoft.com/ws/2008/06/identity/claims/role"] or claims.role or ""
                      kong.service.request.set_header("X-User-Id", claims.sub or "")
                      kong.service.request.set_header("X-User-Role", role)
          - name: catalog-library
            paths:
              - /library
            methods:
              - GET
            strip_path: false
            plugins:
              - name: jwt
                config:
                  claims_to_verify:
                    - exp
              - name: post-function
                config:
                  access:
                    - |
                      local jwt_parser = require("kong.plugins.jwt.jwt_parser")
                      local decoded = jwt_parser:new(kong.ctx.shared.authenticated_jwt_token)
                      local claims = decoded and decoded.claims or {}
                      local role = claims["http://schemas.microsoft.com/ws/2008/06/identity/claims/role"] or claims.role or ""
                      kong.service.request.set_header("X-User-Id", claims.sub or "")
                      kong.service.request.set_header("X-User-Role", role)

    plugins:
      - name: request-transformer
        config:
          remove:
            headers:
              - X-User-Id
              - X-User-Role

    consumers:
      - username: arcadelink-users
        jwt_secrets:
          - key: ArcadeLink.Users
            algorithm: HS256
            secret: dev-only-change-me-arcadelink-shared-jwt-signing-key-32bytes-min
